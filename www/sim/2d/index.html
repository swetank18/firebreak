<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Firebreak simulation console — replay a five-layer city cascade, rewind it, and compare what three different interventions do to the same seed.">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="index,follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><text y=%22.9em%22 font-size=%2258%22>&#128293;</text></svg>">
</head>
<body>
<title>Firebreak — 2D console</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#f4f6f8; --panel:#ffffff; --ink:#111820; --ink-2:#495868; --ink-3:#7b8b9c;
  --rule:#d7dee6; --rule-2:#e8edf2;
  --power:#c47f10; --water:#2f7fbf; --transport:#8a94a0; --telecom:#7a5bb5; --health:#1f2a36;
  --alarm:#c0392b; --safe:#2e7d5b; --accent:#c47f10;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0d1218; --panel:#141c25; --ink:#e6edf4; --ink-2:#a3b2c2; --ink-3:#6f8092;
  --rule:#243040; --rule-2:#1c2733;
  --power:#e0a340; --water:#5aa5de; --transport:#7d8996; --telecom:#a184d8; --health:#e6edf4;
  --alarm:#e0685a; --safe:#4fae84; --accent:#e0a340;
}}
:root[data-theme="dark"]{
  --ground:#0d1218; --panel:#141c25; --ink:#e6edf4; --ink-2:#a3b2c2; --ink-3:#6f8092;
  --rule:#243040; --rule-2:#1c2733;
  --power:#e0a340; --water:#5aa5de; --transport:#7d8996; --telecom:#a184d8; --health:#e6edf4;
  --alarm:#e0685a; --safe:#4fae84; --accent:#e0a340;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);overflow:hidden;
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:13px}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

/* ---------- the instrument ---------- */
.console{display:grid;height:100vh;height:100dvh;
  grid-template-columns:minmax(0,1fr) 340px;
  grid-template-rows:auto minmax(0,1fr) auto auto;
  grid-template-areas:"head head" "map side" "time time" "beats beats"}

.head{grid-area:head;display:flex;align-items:center;gap:16px;padding:10px 16px;
  border-bottom:2px solid var(--ink);background:var(--panel);flex-wrap:wrap}
.wordmark{font-family:"IBM Plex Mono",monospace;font-weight:700;letter-spacing:.18em;font-size:15px}
.head .where{color:var(--ink-3);font-size:12px}
.head .clock{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:20px;font-weight:600;
  font-variant-numeric:tabular-nums;letter-spacing:.02em}
.head a.back{color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--rule);font-size:12px}
.head a.back:hover{color:var(--ink);border-color:var(--ink)}

.mapwrap{grid-area:map;position:relative;min-width:0;min-height:0;background:var(--panel);
  border-right:1px solid var(--rule)}
canvas{display:block;width:100%;height:100%}
.legend{position:absolute;left:12px;bottom:12px;display:flex;gap:4px;flex-direction:column;
  background:rgba(20,28,37,.90);border:1px solid var(--rule);padding:8px}
.legend button{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-2);
  padding:2px 4px;width:100%;text-align:left}
.legend button[aria-pressed="false"]{opacity:.35;text-decoration:line-through}
.legend i{width:9px;height:9px;border-radius:50%;flex:none}
.mapnote{position:absolute;right:12px;bottom:12px;font-size:11px;color:var(--ink-3);
  background:rgba(20,28,37,.90);border:1px solid var(--rule);
  padding:6px 9px;max-width:230px;line-height:1.45}
.mapnote b{color:var(--safe);font-weight:600}

.side{grid-area:side;overflow-y:auto;background:var(--panel);display:flex;flex-direction:column}
.blk{border-bottom:1px solid var(--rule);padding:12px 14px}
.blk h2{margin:0 0 9px;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);font-weight:500;font-family:"IBM Plex Mono",monospace}

.runs{display:flex;flex-direction:column;gap:1px;background:var(--rule);border:1px solid var(--rule)}
.runs button{display:grid;grid-template-columns:10px 1fr auto;align-items:center;gap:9px;
  padding:8px 10px;background:var(--panel);text-align:left}
.runs button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
.runs .dot{width:9px;height:9px;border-radius:50%}
.runs .val{font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-variant-numeric:tabular-nums}
.runs .lbl{font-size:12.5px}

.counters{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--rule);
  border:1px solid var(--rule)}
.counters div{background:var(--panel);padding:8px 10px}
.counters .k{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);
  font-family:"IBM Plex Mono",monospace}
.counters .v{font-family:"IBM Plex Mono",monospace;font-size:19px;font-weight:600;
  font-variant-numeric:tabular-nums;margin-top:1px}

.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
  text-align:right;word-break:break-all}

.alarmpair{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--rule);
  border:1px solid var(--rule)}
.alarmpair div{background:var(--panel);padding:9px 10px}
.alarmpair .id{font-family:"IBM Plex Mono",monospace;font-size:11px;word-break:break-all}
.alarmpair .n{font-family:"IBM Plex Mono",monospace;font-size:21px;font-weight:600;margin-top:5px}
.alarmpair .hot .n{color:var(--alarm)} .alarmpair .cool .n{color:var(--ink-3)}
.alarmpair .cap{font-size:10px;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase;
  font-family:"IBM Plex Mono",monospace;margin-top:5px}

.act{border:1px solid var(--rule);border-left:3px solid var(--safe);padding:9px 11px}
.act .kind{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600}
.act ul{margin:7px 0 0;padding-left:15px;color:var(--ink-2);font-size:11.5px;line-height:1.5}
.act .tgt{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-2);
  margin-top:7px;line-height:1.55;word-break:break-all}
.deadline{display:flex;align-items:baseline;gap:7px;margin-top:8px;padding-top:8px;
  border-top:1px solid var(--rule-2)}
.deadline .t{font-family:"IBM Plex Mono",monospace;font-size:23px;font-weight:600;color:var(--alarm)}
.deadline .u{font-size:11px;color:var(--ink-3)}

/* ---------- timeline: the hero ---------- */
.time{grid-area:time;background:var(--panel);border-top:1px solid var(--rule);
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;
  padding:9px 16px}
.transport{display:flex;gap:6px}
.transport button{border:1px solid var(--ink);padding:5px 12px;font-family:"IBM Plex Mono",monospace;
  font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:var(--ground)}
.transport button.ghost{background:transparent;color:var(--ink)}
.track{position:relative;height:46px;cursor:ew-resize;touch-action:none}
.track canvas{position:absolute;inset:0}
.track .axis{position:absolute;left:0;right:0;bottom:0;height:15px;border-top:1px solid var(--rule);
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--ink-3)}
.track .axis span{position:absolute;transform:translateX(-50%);top:1px;white-space:nowrap}
.speed{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-3)}
.speed select{font:inherit;font-family:"IBM Plex Mono",monospace;background:var(--panel);
  color:var(--ink);border:1px solid var(--rule);padding:3px 5px}

.beats{grid-area:beats;display:flex;background:var(--ink);border-top:1px solid var(--ink)}
.beats button{flex:1;display:flex;align-items:baseline;gap:8px;justify-content:center;
  padding:9px 6px;color:rgba(244,246,248,.70);
  border-right:1px solid rgba(244,246,248,.22);font-size:12px}
.beats button:last-child{border-right:0}
.beats button b{font-family:"IBM Plex Mono",monospace;font-size:11px;opacity:.7}
.beats button[aria-pressed="true"]{background:var(--ground);color:var(--ink)}
.beats button[aria-pressed="true"] b{color:var(--accent);opacity:1}

@media (max-width:900px){
  .console{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 44vh auto auto auto;
    grid-template-areas:"head" "map" "side" "time" "beats";overflow-y:auto}
  body{overflow:auto}
  .side{max-height:none}
  .beats button span{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="console">
  <header class="head">
    <span class="wordmark">FIREBREAK</span>
    <span class="where mono" id="where"></span>
    <span class="clock" id="clock">T+00:00</span>
    <a class="back" href="../">3D view</a>
    <a class="back" href="../../">Write-up</a>
  </header>

  <div class="mapwrap">
    <canvas id="map" aria-label="Map of Chennai showing five infrastructure layers and the cascade in progress"></canvas>
    <div class="legend" id="legend" role="group" aria-label="Show or hide layers"></div>
    <div class="mapnote" id="mapnote" hidden></div>
  </div>

  <aside class="side">
    <div class="blk">
      <h2>Counterfactual</h2>
      <div class="runs" id="runs" role="group" aria-label="Choose which run to replay"></div>
    </div>

    <div class="blk">
      <h2>As of the clock</h2>
      <div class="counters">
        <div><div class="k">Assets down</div><div class="v" id="cFail">0</div></div>
        <div><div class="k">Hospitals</div><div class="v" id="cHosp" style="color:var(--alarm)">0</div></div>
        <div><div class="k">People affected</div><div class="v" id="cPeople">0</div></div>
        <div><div class="k">Above n=1</div><div class="v" id="cDanger" style="color:var(--accent)">0</div></div>
      </div>
    </div>

    <div class="blk">
      <h2>Two alarms, one dangerous</h2>
      <div class="alarmpair" id="pair"></div>
    </div>

    <div class="blk" id="actBlk">
      <h2>Firebreak's action</h2>
      <div class="act" id="act"></div>
    </div>

    <div class="blk">
      <h2>Asset</h2>
      <dl class="kv" id="inspect"><dt>Hover the map</dt><dd>—</dd></dl>
    </div>

    <div class="blk" style="border-bottom:0">
      <h2>City</h2>
      <dl class="kv" id="cityStats"></dl>
    </div>
  </aside>

  <div class="time">
    <div class="transport">
      <button id="play">Play</button>
      <button id="reset" class="ghost">Reset</button>
    </div>
    <div class="track" id="track" role="slider" tabindex="0" aria-label="Scrub the scenario clock"
         aria-valuemin="0" aria-valuenow="0" aria-valuetext="T+00:00">
      <canvas id="tl"></canvas>
      <div class="axis" id="axis"></div>
    </div>
    <label class="speed">Speed
      <select id="speed">
        <option value="200">1×</option>
        <option value="420" selected>2×</option>
        <option value="900">4×</option>
      </select>
    </label>
  </div>

  <nav class="beats" id="beats" aria-label="Demo beats"></nav>
</div>

    tctx.setLineDash([]);
    const px = clock / T_END * TW;
    tctx.strokeStyle = col('ink'); tctx.lineWidth = 2;
    tctx.beginPath(); tctx.moveTo(px, 0); tctx.lineTo(px, TH); tctx.stroke();
    tctx.fillStyle = col('ink');
    tctx.beginPath(); tctx.moveTo(px - 4, 0); tctx.lineTo(px + 4, 0); tctx.lineTo(px, 6); tctx.fill();
  }
  function drawAxis() {
    const a = $('axis'); a.innerHTML = '';
    for (let h = 0; h <= 72; h += 12) {
      const s = document.createElement('span');
      s.style.left = (h * 3600 / T_END * 100) + '%';
      s.textContent = h + 'h'; a.appendChild(s);
    }
    const d = document.createElement('span');
    d.style.left = (T_DEC / T_END * 100) + '%';
    d.style.color = col('accent');
    d.textContent = 'decide'; a.appendChild(d);
  }

  // ---------- state ----------
  function seekTo(t) {
    t = Math.max(0, Math.min(T_END, t));
    const tlr = RUNS[runKey].timeline;
    if (t < clock) { state = {}; cursor = 0; }
    clock = t;
    while (cursor < tlr.length && tlr[cursor].t <= clock) {
      const e = tlr[cursor++];
      if (byId[e.n]) state[e.n] = e;
    }
    render();
  }
  function counters() {
    let f = 0, hosp = 0, people = 0, dang = 0;
    for (const k in state) {
      const n = byId[k]; if (!n) continue;
      f++; people += n.pop || 0;
      if (n.k === 'hospital') hosp++;
      if (state[k].br > 1) dang++;
    }
    $('cFail').textContent = fmt(f);
    $('cHosp').textContent = hosp;
    $('cPeople').textContent = fmt(people);
    $('cDanger').textContent = dang;
  }
  function stamp() {
    const h = Math.floor(clock / 3600), m = Math.floor((clock % 3600) / 60);
    const txt = 'T+' + String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
    $('clock').textContent = txt;
    const tr = $('track');
    tr.setAttribute('aria-valuenow', Math.round(clock));
    tr.setAttribute('aria-valuetext', txt);
  }
  function savedCount() {
    let n = 0;
    for (const id in baseline) if (baseline[id] <= clock && !state[id]) n++;
    return n;
  }
  function render() {
    drawMap(); drawTrack(); counters(); stamp();
    const note = $('mapnote');
    if (runKey === 'do_nothing') { note.hidden = true; }
    else {
      const s = savedCount();
      note.hidden = false;
      note.innerHTML = s
        ? `<b>${fmt(s)} assets still up</b> that had already failed by now if nobody acted. Ringed in green.`
        : 'No divergence from the do-nothing run yet.';
    }
    document.querySelectorAll('#runs button').forEach(b =>
      b.setAttribute('aria-pressed', String(b.dataset.run === runKey)));
  }

  // ---------- playback ----------
  function stop() { playing = false; if (raf) cancelAnimationFrame(raf); $('play').textContent = 'Play'; }
  function tick() {
    if (!playing) return;
    const step = T_END / Number($('speed').value);
    if (clock + step >= T_END) { seekTo(T_END); stop(); $('play').textContent = 'Replay'; return; }
    seekTo(clock + step);
    raf = requestAnimationFrame(tick);
  }
  function play() {
    if (clock >= T_END) seekTo(0);
    playing = true; $('play').textContent = 'Pause'; raf = requestAnimationFrame(tick);
  }
  function selectRun(k) {
    if (!RUNS[k]) return;
    stop(); runKey = k; BINS = bins(); state = {}; cursor = 0;
    const at = clock; clock = 0; seekTo(at);
    paintAction();
  }

  // ---------- panels ----------
  function paintRuns() {
    $('runs').innerHTML = ORDER.filter(k => RUNS[k]).map(k => {
      const s = RUNS[k].summary, m = META[k];
      return `<button data-run="${k}" aria-pressed="${k === runKey}">
        <span class="dot" style="background:var(--${m.dot})"></span>
        <span class="lbl">${m.label}</span>
        <span class="val">${fmt(Math.round(s.person_hours))}</span></button>`;
    }).join('');
    $('runs').querySelectorAll('button').forEach(b =>
      b.addEventListener('click', () => selectRun(b.dataset.run)));
  }
  function paintAction() {
    const iv = DATA.intervention || {};
    if (runKey === 'human') {
      const t = (DATA.human_action || {}).targets || [];
      $('actBlk').querySelector('h2').textContent = 'The human instinct';
      $('act').style.borderLeftColor = col('accent');
      $('act').innerHTML = `<div class="kind">harden &times; ${t.length}</div>
        <ul><li>Protect the most critical assets on the map — the same budget, and what an
        experienced operator reaches for.</li>
        <li>It does not stop the cascade: ${fmt(Math.round(RUNS.human.summary.person_hours))}
        person-hours lost against ${fmt(Math.round(RUNS.firebreak.summary.person_hours))}.</li></ul>
        <div class="tgt">${t.join('<br>')}</div>`;
      return;
    }
    $('actBlk').querySelector('h2').textContent = "Firebreak's action";
    $('act').style.borderLeftColor = col('safe');
    const mins = Math.round((iv.deadline_s || 0) / 60);
    $('act').innerHTML = `<div class="kind">${iv.kind || 'n/a'} &times; ${(iv.targets || []).length}
        <span style="color:var(--ink-3);font-weight:400">· cost ${iv.cost || 0}</span></div>
      <ul>${(iv.rationale || []).map(r => `<li>${r}</li>`).join('')}</ul>
      <div class="tgt">${(iv.targets || []).join('<br>')}</div>
      <div class="deadline"><span class="t">${mins}</span><span class="u">minutes before this
        option is worth less than 90% of acting now</span></div>`;
  }
  function paintPair() {
    const p = DATA.pair;
    if (!p) { $('pair').innerHTML = '<div>No pair in this run.</div>'; return; }
    $('pair').innerHTML = `
      <div class="hot"><div class="id">${p.danger.id}</div><div class="n">${p.danger.br.toFixed(2)}</div>
        <div class="cap">n · score ${p.danger.score.toFixed(2)}</div></div>
      <div class="cool"><div class="id">${p.decoy.id}</div><div class="n">${p.decoy.br.toFixed(2)}</div>
        <div class="cap">n · score ${p.decoy.score.toFixed(2)}</div></div>`;
  }
  function paintStats() {
    const s = DATA.stats;
    $('cityStats').innerHTML = [
      ['Assets', fmt(s.nodes)], ['Dependencies', fmt(s.deps)],
      ['Diesel edges', s.diesel], ['Kernel edges', fmt(s.kernel_edges)],
      ['Spectral radius', s.rho],
    ].map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');
    $('where').textContent = `${DATA.city} · monsoon_flood · seed ${DATA.seed}`;
  }
  function paintLegend() {
    $('legend').innerHTML = LAYERS.map(l =>
      `<button data-layer="${l}" aria-pressed="true"><i style="background:var(--${l})"></i>${l}</button>`
    ).join('');
    $('legend').querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
      const l = b.dataset.layer;
      hidden.has(l) ? hidden.delete(l) : hidden.add(l);
      b.setAttribute('aria-pressed', String(!hidden.has(l)));
      drawMap();
    }));
  }
  function paintInspect(n) {
    if (!n) { $('inspect').innerHTML = '<dt>Hover the map</dt><dd>—</dd>'; return; }
    const st = state[n.id];
    const rows = [['Asset', n.id], ['Layer', n.l], ['Kind', n.k],
                  ['People served', fmt(n.pop)]];
    if (st) {
      rows.push(['Failed at', 'T+' + String(Math.floor(st.t / 3600)).padStart(2, '0') + ':' +
                              String(Math.floor((st.t % 3600) / 60)).padStart(2, '0')]);
      rows.push(['Anomaly score', st.s.toFixed(3)]);
      rows.push(['Branching ratio', st.br.toFixed(2)]);
      rows.push(['Downstream reach', st.r]);
      rows.push(['Reached health', st.h ? 'yes' : 'no']);
    } else if (baseline[n.id] !== undefined && baseline[n.id] <= clock) {
      rows.push(['Status', 'saved by this action']);
    } else {
      rows.push(['Status', 'up']);
    }
    $('inspect').innerHTML = rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');
  }

  // ---------- the six beats ----------
  const BEATS = [
    ['City', 'five layers'], ['Alarms', 'identical scores'], ['Do nothing', 'the cascade'],
    ['Firebreak', 'the action'], ['Human instinct', 'still cascades'], ['Evidence', 'the numbers'],
  ];
  function paintBeats() {
    $('beats').innerHTML = BEATS.map((b, i) =>
      `<button data-beat="${i + 1}" aria-pressed="false"><b>${i + 1}</b>${b[0]}
        <span style="opacity:.6">${b[1]}</span></button>`).join('');
    $('beats').querySelectorAll('button').forEach(b =>
      b.addEventListener('click', () => beat(Number(b.dataset.beat))));
  }
  function beat(n) {
    $('beats').querySelectorAll('button').forEach(b =>
      b.setAttribute('aria-pressed', String(Number(b.dataset.beat) === n)));
    if (n === 1) { selectRun('do_nothing'); seekTo(0); hidden.clear(); paintLegend(); drawMap(); }
    else if (n === 2) { selectRun('do_nothing'); seekTo(T_DEC); }
    else if (n === 3) { selectRun('do_nothing'); seekTo(0); play(); }
    else if (n === 4) { selectRun('firebreak'); seekTo(0); play(); }
    else if (n === 5) { selectRun('human'); seekTo(0); play(); }
    else if (n === 6) { stop(); seekTo(T_END); }
  }

  // ---------- input ----------
  const track = $('track');
  const seekFromX = ev => {
    const r = track.getBoundingClientRect();
    const x = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
    seekTo(Math.max(0, Math.min(1, x / r.width)) * T_END);
  };
  let dragging = false;
  track.addEventListener('pointerdown', e => {
    dragging = true; stop(); track.setPointerCapture(e.pointerId); seekFromX(e);
  });
  track.addEventListener('pointermove', e => { if (dragging) seekFromX(e); });
  track.addEventListener('pointerup', e => { dragging = false; track.releasePointerCapture(e.pointerId); });
  track.addEventListener('keydown', e => {
    const step = T_END / 72;                       // one hour
    if (e.key === 'ArrowLeft') { stop(); seekTo(clock - step); e.preventDefault(); }
    if (e.key === 'ArrowRight') { stop(); seekTo(clock + step); e.preventDefault(); }
  });

  cv.addEventListener('mousemove', e => {
    const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
    let best = null, bd = 100;
    for (const n of nodes) {
      if (hidden.has(n.l)) continue;
      const dx = X(n) - mx, dy = Y(n) - my, d = dx * dx + dy * dy;
      if (d < bd) { bd = d; best = n; }
    }
    if ((best && best.id) !== (hover && hover.id)) { hover = best; paintInspect(best); drawMap(); }
  });
  cv.addEventListener('mouseleave', () => { hover = null; paintInspect(null); drawMap(); });

  $('play').addEventListener('click', () => playing ? stop() : play());
  $('reset').addEventListener('click', () => { stop(); seekTo(0); });
  $('speed').addEventListener('change', () => { if (playing) { stop(); play(); } });

  document.addEventListener('keydown', e => {
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.isContentEditable)) return;
    if (e.key >= '1' && e.key <= '6') { e.preventDefault(); beat(Number(e.key)); }
    else if (e.key === ' ') { e.preventDefault(); playing ? stop() : play(); }
    else if (e.key.toLowerCase() === 'r') { stop(); seekTo(0); }
  });

  addEventListener('resize', () => { sizeMap(); sizeTrack(); render(); });

  // ---------- boot ----------
  sizeMap(); sizeTrack(); BINS = bins(); drawAxis();
  paintRuns(); paintPair(); paintAction(); paintStats(); paintLegend();
  paintBeats(); paintInspect(null);
  seekTo(T_DEC);                        // open on the moment the decision is made
  $('beats').querySelector('[data-beat="2"]').setAttribute('aria-pressed', 'true');
})();
</script>

</body>
</html>
