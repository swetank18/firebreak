name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'scripts/pitch_template.html'
      - 'scripts/console_template.html'
      - 'scripts/build_site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # www/ is committed, not built here: the numbers come from eval/results/,
      # which is generated by runs that take tens of minutes and must not be
      # re-run on every deploy. CI asserts the committed pages match their
      # inputs, so "committed" and "reproducible" are not in tension.
      - name: Check the pages exist before deploying
        run: |
          test -s www/index.html || { echo "::error::www/index.html missing"; exit 1; }
          test -s www/sim/index.html || { echo "::error::www/sim/index.html missing"; exit 1; }
          test -f www/.nojekyll || { echo "::error::www/.nojekyll missing — Pages would drop it"; exit 1; }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4
